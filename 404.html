<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found | Ravi Kovind</title>
    <meta name="robots" content="noindex" />
    <script type="text/javascript">(function(c,l,a,r,i,t,y){c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y)})(window,document,"clarity","script","zj5pv2lylu");</script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Saira:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --cream: #f3eee3;
        --ink: #111111;
        --accent: #eb1d25;
        --muted: #6b6b6b;
      }
      html, body {
        height: 100%;
        background: var(--cream);
        color: var(--ink);
        font-family: 'Saira', sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        text-align: center;
        gap: 0;
      }
      .code {
        font-size: clamp(96px, 20vw, 160px);
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.04em;
        color: var(--ink);
      }
      .code span { color: var(--accent); }
      .title {
        margin-top: 16px;
        font-size: clamp(18px, 4vw, 24px);
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .sub {
        margin-top: 10px;
        font-size: 14px;
        color: var(--muted);
        max-width: 320px;
        line-height: 1.6;
      }
      .actions {
        margin-top: 32px;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
      }
      a.btn {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 10px 20px;
        border-radius: 999px;
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        transition: opacity 0.15s, transform 0.15s;
      }
      a.btn:hover { opacity: 0.85; transform: translateY(-2px); }
      a.btn-primary { background: var(--ink); color: var(--cream); }
      a.btn-secondary { background: transparent; color: var(--ink); border: 1.5px solid #ccc8be; }
    </style>
  </head>
  <body>
    <p class="code">4<span>0</span>4</p>
    <p class="title">Page not found.</p>
    <p class="sub">The page you're looking for doesn't exist or was moved.</p>
    <div class="actions">
      <a href="/" class="btn btn-primary">Go Home</a>
      <a href="/resume.html" class="btn btn-secondary">View Resume</a>
    </div>
  </body>
</html>
